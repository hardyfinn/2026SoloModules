<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F2430"/></marker></defs>
  <rect x="0" y="0" width="640" height="230" fill="#ffffff"/>
  <g fill="#F3EBDB" stroke="#B9AD92">
    <rect x="10" y="10" width="190" height="56" rx="6"/>
    <rect x="230" y="10" width="250" height="56" rx="6"/>
    <rect x="10" y="110" width="140" height="80" rx="6"/>
    <rect x="172" y="110" width="118" height="80" rx="6"/>
    <rect x="312" y="110" width="110" height="80" rx="6"/>
    <rect x="444" y="110" width="90" height="80" rx="6"/>
  </g>
  <rect x="556" y="130" width="74" height="40" rx="6" fill="#2A3140"/>
  <g fill="#1F2430" font-weight="700">
    <text x="20" y="32">PHRASE</text><text x="240" y="32">NOTE (a gesture)</text>
    <text x="20" y="132">SYRINX</text><text x="182" y="132">TRACHEA</text><text x="322" y="132">THROAT</text><text x="454" y="132">BEAK</text>
  </g>
  <g fill="#5E6470" font-size="10.5">
    <text x="20" y="50">types A B C D, PATTERN, RATE,</text><text x="20" y="62">DRIFT, ACCEL, SWELL, seed</text>
    <text x="240" y="50">pressure envelope + tension slide,</text><text x="240" y="62">BUZZ and CHOP on top</text>
    <text x="20" y="150">two sides, each driven</text><text x="20" y="164">by PRESSURE and</text><text x="20" y="178">TENSION; SIZE scales</text>
    <text x="182" y="150">a tube that adds</text><text x="182" y="164">hollow resonances</text><text x="182" y="178">(TRACHEA, TUBE)</text>
    <text x="322" y="150">band-pass that</text><text x="322" y="164">follows the pitch</text><text x="322" y="178">or a fixed formant</text>
    <text x="454" y="150">open = bright,</text><text x="454" y="164">closed = muffled</text>
  </g>
  <text x="578" y="155" fill="#C4501A" font-weight="700">OUT</text>
  <g stroke="#1F2430" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <line x1="200" y1="38" x2="228" y2="38"/>
    <path d="M355,66 L355,90 L80,90 L80,108"/>
    <line x1="150" y1="150" x2="170" y2="150"/>
    <line x1="290" y1="150" x2="310" y2="150"/>
    <line x1="422" y1="150" x2="442" y2="150"/>
    <line x1="534" y1="150" x2="554" y2="150"/>
  </g>
  <text x="365" y="86" fill="#5E6470" font-size="11">one note = a gesture in pressure and tension</text>
</svg>
