# Builds every plugin folder in this repository (any folder with a plugin.json)
# for Apple Silicon Macs on every push. Finished .vcvplugin files appear under
# the run's "Artifacts", and on the "latest" (main) or "preview" (branches) release.
name: Build plugins

on:
  push:
    # claude/project-thread-sjbahg only builds MTRX-1K for Mac (see mtrx-1k-mac.yml)
    branches: [main, "claude/**", "!claude/project-thread-sjbahg"]
  workflow_dispatch:

permissions:
  contents: write

env:
  RACK_SDK_VERSION: 2.6.4

jobs:
  build-mac-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew list zstd >/dev/null 2>&1 || brew install zstd
      - name: Download Rack SDK
        run: |
          curl -fsSL -o sdk.zip "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-mac-arm64.zip"
          unzip -q sdk.zip -d "$RUNNER_TEMP"
      - name: Build every plugin
        run: |
          mkdir -p out
          for d in */; do
            if [ -f "$d/plugin.json" ]; then
              echo "::group::$d"
              make -C "$d" dist RACK_DIR="$RUNNER_TEMP/Rack-SDK" -j3
              cp "$d"/dist/*.vcvplugin out/
              echo "::endgroup::"
            fi
          done
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: plugins-mac-arm64
          path: out/*.vcvplugin
      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest build" --notes "Built automatically from main."
          gh release upload latest out/*.vcvplugin --clobber
      - name: Publish branch builds to the "preview" release
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view preview >/dev/null 2>&1 || gh release create preview --prerelease --title "Preview build" --notes "Built from a branch, for trying changes before they are merged."
          gh release upload preview out/*.vcvplugin --clobber
